<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<title>Feedback System</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg,#0f172a,#1e3a8a);
    margin: 0;
    color: white;
    text-align: center;
}

.container {
    background: white;
    color: black;
    padding: 20px;
    margin: 30px auto;
    width: 350px;
    border-radius: 12px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}

input, select, textarea {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    padding: 10px;
    background: #1e3a8a;
    color: white;
    border: none;
    border-radius: 6px;
    width: 100%;
    cursor: pointer;
}

button:hover {
    background: #14235c;
}

.card {
    background: #f5f5f5;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
}

.logout {
    margin-top: 10px;
    background: red;
}

.toggle {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

.toggle button {
    flex: 1;
    background: #e5e7eb;
    color: black;
    font-weight: bold;
}

.toggle button.active {
    background: #1e3a8a;
    color: white;
}

h2 {
    color: #e0e7ff;
}
</style>
</head>

<body>

<h2>🎓 Feedback System</h2>

<!-- LOGIN -->
<div class="container" id="loginBox">
<h3>Login</h3>

<div class="toggle">
    <button id="studentBtn" onclick="selectRole('student')">Student</button>
    <button id="facultyBtn" onclick="selectRole('faculty')">Faculty</button>
</div>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- APP -->
<div id="app" style="display:none">

<!-- FACULTY -->
<div class="container" id="facultyBox" style="display:none">
<h3>➕ Add Session</h3>
<input id="title" placeholder="Session Title">
<button onclick="addSession()">Add Session</button>
</div>

<!-- STUDENT -->
<div class="container" id="studentBox" style="display:none">
<h3>📝 Submit Feedback</h3>
<select id="sessions"></select>
<textarea id="message" placeholder="Your feedback"></textarea>
<button onclick="submitFeedback()">Submit</button>
</div>

<!-- ANALYTICS -->
<div class="container" id="analyticsBox" style="display:none">
<h3>📊 Analytics Dashboard</h3>

<div class="card">
    <h4>Total Feedback</h4>
    <p id="total" style="font-size:20px;font-weight:bold;"></p>
</div>

<div class="card">
    <h4>Session-wise Feedback</h4>
    <canvas id="pieChart"></canvas>
</div>

</div>

<!-- FEEDBACK -->
<div class="container" id="feedbackBox" style="display:none">
<h3>📋 Feedbacks</h3>
<div id="list"></div>
</div>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>

const API = "https://ug9e6m01ye.execute-api.us-east-1.amazonaws.com/prod/api";

// TOGGLE LOGIC
let selectedRole = "student";

function selectRole(role){
    selectedRole = role;

    document.getElementById("studentBtn").classList.remove("active");
    document.getElementById("facultyBtn").classList.remove("active");

    if(role === "student"){
        document.getElementById("studentBtn").classList.add("active");
    } else {
        document.getElementById("facultyBtn").classList.add("active");
    }
}

// LOGIN
async function login(){
    const res = await fetch(API + "/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    });

    const data = await res.json();
    const user = typeof data.body === "string" ? JSON.parse(data.body) : data;

    if(user.role && user.role === selectedRole){

        localStorage.setItem("role", user.role);
        localStorage.setItem("email", user.email);

        document.getElementById("loginBox").style.display="none";
        document.getElementById("app").style.display="block";

        if(user.role === "faculty"){
            document.getElementById("facultyBox").style.display = "block";
            document.getElementById("feedbackBox").style.display = "block";
            document.getElementById("analyticsBox").style.display = "block";
            loadAnalytics();
        } else {
            document.getElementById("studentBox").style.display = "block";
        }

        loadSessions();
        loadFeedback();

    } else {
        alert("Wrong role selected or invalid credentials");
    }
}

// ADD SESSION
async function addSession(){
    await fetch(API + "/add-session", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ title: title.value })
    });

    alert("Session added!");
    title.value = "";
    loadSessions();
}

// LOAD SESSIONS
async function loadSessions(){
    const res = await fetch(API + "/sessions");
    const data = await res.json();

    const sessionsData = typeof data.body === "string" ? JSON.parse(data.body) : data;

    const dropdown = document.getElementById("sessions");
    dropdown.innerHTML = "";

    sessionsData.forEach(s=>{
        dropdown.innerHTML += `<option value="${s.session_id}">${s.title}</option>`;
    });
}

// SUBMIT FEEDBACK
async function submitFeedback(){
    await fetch(API + "/feedback", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
            email: localStorage.getItem("email"),
            session_id: sessions.value,
            message: message.value
        })
    });

    alert("Feedback submitted!");
    message.value = "";
    loadFeedback();
}

// LOAD FEEDBACK
async function loadFeedback(){
    const [fRes, sRes] = await Promise.all([
        fetch(API + "/feedback"),
        fetch(API + "/sessions")
    ]);

    const fData = await fRes.json();
    const sData = await sRes.json();

    const feedbackData = typeof fData.body === "string" ? JSON.parse(fData.body) : fData;
    const sessionsData = typeof sData.body === "string" ? JSON.parse(sData.body) : sData;

    const sessionMap = {};
    sessionsData.forEach(s => {
        sessionMap[s.session_id] = s.title;
    });

    const grouped = {};

    feedbackData.forEach(f => {
        const title = sessionMap[f.session_id] || "Unknown";

        if(!grouped[title]){
            grouped[title] = [];
        }

        grouped[title].push(f);
    });

    const list = document.getElementById("list");
    list.innerHTML = "";

    for(const session in grouped){
        list.innerHTML += `<h4>📚 ${session}</h4>`;

        grouped[session].forEach(f => {
            list.innerHTML += `
            <div class="card">
                <b>👤 ${f.email}</b><br>
                💬 ${f.message}
            </div>`;
        });
    }
}

// ANALYTICS
async function loadAnalytics(){
    const [aRes, sRes] = await Promise.all([
        fetch(API + "/analytics"),
        fetch(API + "/sessions")
    ]);

    const aData = await aRes.json();
    const sData = await sRes.json();

    const analytics = typeof aData.body === "string" ? JSON.parse(aData.body) : aData;
    const sessions = typeof sData.body === "string" ? JSON.parse(sData.body) : sData;

    const sessionMap = {};
    sessions.forEach(s => {
        sessionMap[s.session_id] = s.title;
    });

    document.getElementById("total").innerText =
        "Total Feedback: " + analytics.total_feedback;

    const labels = [];
    const values = [];

    for(let id in analytics.session_wise){
        labels.push(sessionMap[id] || "Unknown");
        values.push(analytics.session_wise[id]);
    }

    if(window.pieChartInstance){
        window.pieChartInstance.destroy();
    }

    const ctx = document.getElementById("pieChart").getContext("2d");

    window.pieChartInstance = new Chart(ctx, {
        type: "pie",
        data: {
            labels: labels,
            datasets: [{
                data: values,
                backgroundColor: [
                    "#6a11cb","#2575fc","#ff7eb3","#ff9a44","#00c9a7","#f6d365"
                ]
            }]
        },
        options: {
            plugins: {
                legend: { position: "top" },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            const total = context.dataset.data.reduce((a,b)=>a+b,0);
                            const value = context.raw;
                            const percent = ((value/total)*100).toFixed(1);
                            return `${context.label}: ${value} (${percent}%)`;
                        }
                    }
                }
            }
        }
    });
}

// LOGOUT
function logout(){
    localStorage.clear();
    location.reload();
}

// DEFAULT ROLE
selectRole("student");

</script>

</body>
</html>
